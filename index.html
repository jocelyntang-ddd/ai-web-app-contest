<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web App Contest — Vote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       CONFIGURATION — edit these values
       ============================================= */
    :root {
      --contest-name: "Web App Contest 2026"; /* not used in CSS, just for reference */

      /* Google Form — replace these three values after creating your form.
         See README at the bottom of this file for instructions. */
      --_form-id: "1LzVzil37RZ4_b7g3mPpjAwBE5LjDk8WIcO_8dGMQrvk";
    }

    /* =============================================
       BASE
       ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0d0d0f;
      color: #e8e6e1;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* =============================================
       BACKGROUND TEXTURE
       ============================================= */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(120, 80, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 80%, rgba(255, 160, 60, 0.08) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* =============================================
       LAYOUT
       ============================================= */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    /* =============================================
       HEADER
       ============================================= */
    header {
      padding: 56px 0 48px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 48px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 14px;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(36px, 5vw, 58px);
      font-weight: 400;
      line-height: 1.1;
      color: #f5f3ee;
      margin-bottom: 16px;
      max-width: 640px;
    }

    header h1 em {
      font-style: italic;
      color: #c4b5fd;
    }

    header p {
      font-size: 16px;
      color: rgba(232, 230, 225, 0.55);
      max-width: 520px;
      line-height: 1.7;
    }

    /* =============================================
       PROGRESS
       ============================================= */
    .progress-section {
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .progress-track {
      flex: 1;
      min-width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 3px;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 99px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .progress-text {
      font-size: 13px;
      color: rgba(232,230,225,0.5);
      white-space: nowrap;
    }

    .progress-text strong {
      color: #a78bfa;
      font-weight: 600;
    }

    /* =============================================
       APPS GRID
       ============================================= */
    .grid-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232,230,225,0.35);
      margin-bottom: 20px;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    /* =============================================
       APP CARD
       ============================================= */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      user-select: none;
    }

    .card:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.16);
      transform: translateY(-2px);
    }

    .card.selected {
      border-color: #7c3aed;
      background: rgba(124, 58, 237, 0.12);
    }

    .card.disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }

    .card-thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rank-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card.selected .rank-badge {
      opacity: 1;
      transform: scale(1);
    }

    .card-body {
      padding: 14px 16px 16px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      color: #f5f3ee;
      margin-bottom: 4px;
    }

    .card-desc {
      font-size: 13px;
      color: rgba(232,230,225,0.45);
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: #a78bfa;
      transition: color 0.15s;
    }

    .card-link:hover { color: #c4b5fd; }

    .card-link svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* =============================================
       FOOTER TRAY
       ============================================= */
    .tray {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(13,13,15,0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tray-picks {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
    }

    .tray-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232,230,225,0.3);
      white-space: nowrap;
    }

    .picks-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pick-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,58,237,0.2);
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 99px;
      padding: 4px 8px 4px 6px;
      font-size: 12px;
      color: #c4b5fd;
      animation: pillIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pillIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }

    .pick-pill .rank-num {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #7c3aed;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .pick-pill button {
      background: none;
      border: none;
      color: rgba(196,181,253,0.6);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .pick-pill button:hover { color: #f5f3ee; }

    .empty-hint {
      font-size: 13px;
      color: rgba(232,230,225,0.25);
      font-style: italic;
    }

    /* Vote button */
    .vote-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }

    .vote-btn:not(:disabled):hover { background: #6d28d9; transform: translateY(-1px); }
    .vote-btn:not(:disabled):active { transform: translateY(0); }
    .vote-btn:disabled { opacity: 0.35; cursor: default; }

    .vote-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =============================================
       CARD THUMB COLORS (one per app)
       ============================================= */
    .thumb-0 { background: rgba(124,58,237,0.15); }
    .thumb-1 { background: rgba(16,185,129,0.12); }
    .thumb-2 { background: rgba(245,158,11,0.12); }
    .thumb-3 { background: rgba(239,68,68,0.12); }
    .thumb-4 { background: rgba(59,130,246,0.12); }
    .thumb-5 { background: rgba(236,72,153,0.12); }
    .thumb-6 { background: rgba(20,184,166,0.12); }
    .thumb-7 { background: rgba(234,179,8,0.12); }
    .thumb-8 { background: rgba(99,102,241,0.12); }
    .thumb-9 { background: rgba(249,115,22,0.12); }



    /* =============================================
       CATEGORY TABS + OFFICE SECTIONS
       ============================================= */
    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .tab-btn {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(232,230,225,0.62);
      border-radius: 999px;
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .tab-btn:hover {
      color: #f5f3ee;
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      color: #fff;
      background: rgba(124,58,237,0.22);
      border-color: rgba(124,58,237,0.65);
    }

    .office-section {
      margin-bottom: 56px;
    }

    .office-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .office-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 400;
      color: #f5f3ee;
    }

    .office-meta {
      font-size: 12px;
      color: rgba(232,230,225,0.38);
      white-space: nowrap;
    }

    .section-note {
      margin-top: -8px;
      margin-bottom: 24px;
      color: rgba(232,230,225,0.45);
      font-size: 14px;
      line-height: 1.6;
    }


    .office-submit-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -18px;
      margin-bottom: 10px;
    }

    .office-submit-hint {
      font-size: 12px;
      color: rgba(232,230,225,0.38);
      margin-right: 12px;
      align-self: center;
    }

    .tray-office-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tray-office-buttons .vote-btn {
      padding: 10px 14px;
      font-size: 13px;
    }

    /* =============================================
       RESPONSIVE
       ============================================= */
    @media (max-width: 540px) {
      header { padding: 36px 0 32px; }
      .tray { padding: 10px 16px; }
      .vote-btn { padding: 10px 16px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <div class="eyebrow">Community Vote</div>
    <h1>Vote for your <em>favourite</em> submissions</h1>
    <p>Choose a category, browse the top 10 submissions for each office, and select your <strong>top 3 from each office</strong> in order. Your first pick earns the most points.</p>
  </header>

  <div class="tabs" id="categoryTabs" aria-label="Voting categories"></div>

  <div class="progress-section">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText"><strong>0</strong> of 9 selected</div>
  </div>

  <div class="section-note" id="sectionNote"></div>
  <div id="officeSections"></div>

</div>

<!-- Fixed bottom tray -->
<div class="tray">
  <div class="tray-picks">
    <span class="tray-label">Your current picks</span>
    <div class="picks-list" id="picksList">
      <span class="empty-hint" id="emptyHint">None selected yet</span>
    </div>
  </div>
  <div class="tray-office-buttons" id="trayOfficeButtons" aria-label="Submit votes by office"></div>
</div>

            { id: "web-nairobi-4", name: "MrumbaCanvas Filters Pro", desc: "This app is a modern browser-based image editor that lets users quickly upload, enhance, draw on, and export images with filters, text, and tools, eliminating the need for complex or expensive design software.", url: "https://mrumba-canvas-image-filters-pro.base44.app/", emoji: "🎨", image: "images/mrumba.png" },

  /* =============================================

  const OFFICE_FORMS = {

  /* =============================================
     APP LOGIC — no need to edit below this line
     ============================================= */
  const MAX_PICKS_PER_OFFICE = 3;

  function makeEmptyOfficeRanks(category) {
    return Object.fromEntries(category.offices.map(office => [office.id, []]));
  }

  let activeCategoryId = CATEGORIES[0].id;
  const rankedByCategory = Object.fromEntries(CATEGORIES.map(category => [category.id, makeEmptyOfficeRanks(category)]));

  function getActiveCategory() {
    return CATEGORIES.find(category => category.id === activeCategoryId);
  }

  function getRankedByOffice() {
    return rankedByCategory[activeCategoryId];
  }

  function getTotalRequired(category = getActiveCategory()) {
    return category.offices.length * MAX_PICKS_PER_OFFICE;
  }

  function getTotalSelected() {
    return Object.values(getRankedByOffice()).reduce((total, picks) => total + picks.length, 0);
  }

  function getCompletedOfficeCount() {
    return Object.values(getRankedByOffice()).filter(picks => picks.length === MAX_PICKS_PER_OFFICE).length;
  }

  function hasIncompleteOfficeSelections() {
    return Object.values(getRankedByOffice()).some(picks => picks.length > 0 && picks.length < MAX_PICKS_PER_OFFICE);
  }

  function canSubmitVotes() {
    return getCompletedOfficeCount() > 0 && !hasIncompleteOfficeSelections();
  }

  function getAllSubmissions(category = getActiveCategory()) {
    return category.offices.flatMap(office => office.submissions.map(submission => ({ ...submission, officeId: office.id, office: office.name })));
  }

  function findSubmission(id) {
    return getAllSubmissions().find(submission => submission.id === id);
  }

  function buildTabs() {
    const tabs = document.getElementById('categoryTabs');
    tabs.innerHTML = CATEGORIES.map(category => `
      <button class="tab-btn${category.id === activeCategoryId ? ' active' : ''}"
              onclick="setCategory('${category.id}')"
              aria-pressed="${category.id === activeCategoryId}">
        ${category.label}
      </button>
    `).join('');
  }

  function buildOfficeSections() {
    const category = getActiveCategory();
    const rankedByOffice = getRankedByOffice();
    document.getElementById('sectionNote').textContent = category.note;

    document.getElementById('officeSections').innerHTML = category.offices.map(office => {
      const officeRanked = rankedByOffice[office.id] || [];
      return `
      <section class="office-section" aria-labelledby="office-${office.id}">
        <div class="office-header">
          <h2 class="office-title" id="office-${office.id}">${office.name}</h2>
          <div class="office-meta">${officeRanked.length} of ${MAX_PICKS_PER_OFFICE} selected · Top 10 submissions</div>
        </div>
        <div class="apps-grid">
          ${office.submissions.map((app, i) => buildCard(app, i, office.id, officeRanked)).join('')}
        </div>
        <div class="office-submit-row">
          <span class="office-submit-hint">${officeRanked.length === MAX_PICKS_PER_OFFICE ? 'Ready to submit' : `Select ${MAX_PICKS_PER_OFFICE - officeRanked.length} more`}</span>
          <button class="vote-btn"
                  id="submit-${office.id}"
                  onclick="submitOfficeVotes('${office.id}')"
                  ${officeRanked.length !== MAX_PICKS_PER_OFFICE ? 'disabled' : ''}>
            Submit ${office.name} votes
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
        </div>
      </section>`;
    }).join('');
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[char]));
  }

  function getCardImageSrc(app, index) {
    // To use your own screenshots, add image: "images/your-file.png" to any submission.
    if (app.image) return app.image;

    // Built-in image placeholder: no external files or internet needed.
    const colors = [
      ['#7c3aed', '#c4b5fd'],
      ['#059669', '#6ee7b7'],
      ['#d97706', '#fde68a'],
      ['#dc2626', '#fca5a5'],
      ['#2563eb', '#93c5fd'],
      ['#db2777', '#f9a8d4'],
      ['#0d9488', '#99f6e4'],
      ['#ca8a04', '#fde047'],
      ['#4f46e5', '#a5b4fc'],
      ['#ea580c', '#fdba74']
    ];
    const [start, end] = colors[index % colors.length];
    const initials = app.name
      .split(/\s+/)
      .filter(Boolean)
      .slice(-2)
      .map(word => word[0])
      .join('')
      .toUpperCase();

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="${start}"/>
            <stop offset="100%" stop-color="${end}"/>
          </linearGradient>
        </defs>
        <rect width="600" height="360" fill="url(#g)"/>
        <circle cx="500" cy="70" r="115" fill="rgba(255,255,255,0.16)"/>
        <circle cx="95" cy="300" r="135" fill="rgba(255,255,255,0.10)"/>
        <rect x="190" y="95" width="220" height="170" rx="34" fill="rgba(13,13,15,0.24)" stroke="rgba(255,255,255,0.35)"/>
        <text x="300" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="white">${initials}</text>
      </svg>`;

    return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
  }

  function buildCard(app, i, officeId, officeRanked) {
    const rank = officeRanked.indexOf(app.id);
    const isSel = rank !== -1;
    const isDisabled = !isSel && officeRanked.length >= MAX_PICKS_PER_OFFICE;
    return `
      <div class="card${isSel ? ' selected' : ''}${isDisabled ? ' disabled' : ''}"
           id="card-${app.id}"
           onclick="${isDisabled ? '' : `toggleSubmission('${officeId}', '${app.id}')`}"
           role="checkbox" aria-checked="${isSel}" aria-label="${app.name}">
        <div class="card-thumb thumb-${i % 10}">
          <img src="${getCardImageSrc(app, i)}" alt="Preview image for ${escapeHtml(app.name)}" loading="lazy">
          <div class="rank-badge" id="badge-${app.id}">${isSel ? rank + 1 : ''}</div>
        </div>
        <div class="card-body">
          <div class="card-name">${app.name}</div>
          <div class="card-desc">${app.desc}</div>
          <a class="card-link" href="${app.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            View submission
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>`;
  }

  function setCategory(categoryId) {
    activeCategoryId = categoryId;
    buildTabs();
    buildOfficeSections();
    updateTray();
  }

  function updateTray() {
    const rankedByOffice = getRankedByOffice();
    const totalSelected = getTotalSelected();
    const totalRequired = getTotalRequired();
    const list = document.getElementById('picksList');
    const hint = document.getElementById('emptyHint');
    hint.style.display = totalSelected ? 'none' : 'inline';

    list.querySelectorAll('.pick-pill').forEach(p => p.remove());

    getActiveCategory().offices.forEach(office => {
      const ranked = rankedByOffice[office.id] || [];
      ranked.forEach((id, i) => {
        const submission = findSubmission(id);
        const pill = document.createElement('div');
        pill.className = 'pick-pill';
        pill.dataset.id = id;
        pill.innerHTML = `
          <span class="rank-num">${i + 1}</span>
          <span>${office.name}: ${submission.name}</span>
          <button onclick="toggleSubmission('${office.id}', '${id}')" aria-label="Remove ${submission.name}">×</button>`;
        list.appendChild(pill);
      });
    });

    const pct = (totalSelected / totalRequired) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    const completedOffices = getCompletedOfficeCount();
    document.getElementById('progressText').innerHTML =
      `<strong>${totalSelected}</strong> of ${totalRequired} selected · <strong>${completedOffices}</strong> office${completedOffices === 1 ? '' : 's'} ready`;

    renderTrayOfficeButtons();
  }

  function renderTrayOfficeButtons() {
    const container = document.getElementById('trayOfficeButtons');
    if (!container) return;

    const rankedByOffice = getRankedByOffice();
    container.innerHTML = getActiveCategory().offices.map(office => {
      const selectedCount = (rankedByOffice[office.id] || []).length;
      const isReady = selectedCount === MAX_PICKS_PER_OFFICE;
      return `
        <button class="vote-btn"
                id="tray-submit-${office.id}"
                onclick="submitOfficeVotes('${office.id}')"
                ${isReady ? '' : 'disabled'}>
          Submit ${office.name}
        </button>`;
    }).join('');
  }

  function toggleSubmission(officeId, id) {
    const ranked = getRankedByOffice()[officeId];
    const idx = ranked.indexOf(id);
    if (idx !== -1) ranked.splice(idx, 1);
    else if (ranked.length < MAX_PICKS_PER_OFFICE) ranked.push(id);
    buildOfficeSections();
    updateTray();
  }

  function buildOfficeFormUrl(officeId) {
    const category = getActiveCategory();
    const office = category.offices.find(item => item.id === officeId);
    const ranked = getRankedByOffice()[officeId] || [];
    const formConfig = OFFICE_FORMS[category.id]?.[officeId];

    console.group(`[buildOfficeFormUrl] officeId="${officeId}"`);
    console.log('category.id:', category.id);
    console.log('ranked IDs:', ranked);
    console.log('formConfig:', formConfig);

    if (!formConfig) {
      console.error('❌ No formConfig found for', category.id, officeId);
      console.groupEnd();
      alert(`Missing Google Form configuration for ${category.label} / ${office ? office.name : officeId}.`);
      return null;
    }

    const base = `https://docs.google.com/forms/d/e/${formConfig.formId}/viewform?usp=pp_url`;
    const parts = [];

    if (formConfig.categoryEntry) {
      parts.push(`${formConfig.categoryEntry}=${encodeURIComponent(category.label)}`);
      console.log('categoryEntry part:', parts[parts.length - 1]);
    }

    ranked.forEach((id, i) => {
      const submission = findSubmission(id);
      const entryId = formConfig.choiceEntries[i + 1];
      console.log(`choice ${i + 1}: id="${id}", submission=`, submission, `entryId="${entryId}"`);
      if (!submission) console.warn(`⚠️ No submission found for id="${id}"`);
      if (!entryId) console.warn(`⚠️ No entryId for choiceEntries[${i + 1}]`);
      if (entryId && submission) parts.push(`${entryId}=${encodeURIComponent(submission.name)}`);
    });

    const url = parts.length ? `${base}&${parts.join('&')}` : base;
    console.log('✅ Final URL:', url);
    console.groupEnd();
    return url;
  }

  function submitOfficeVotes(officeId) {
    const ranked = getRankedByOffice()[officeId] || [];
    console.log(`[submitOfficeVotes] officeId="${officeId}", ranked:`, ranked);
    if (ranked.length !== MAX_PICKS_PER_OFFICE) {
      console.warn(`⚠️ Not enough picks: ${ranked.length}/${MAX_PICKS_PER_OFFICE}`);
      return;
    }

    const formUrl = buildOfficeFormUrl(officeId);
    if (!formUrl) return;

    console.log('Opening URL:', formUrl);
    const a = document.createElement('a');
    a.href = formUrl;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  buildTabs();
  buildOfficeSections();
  updateTray();
</script>
